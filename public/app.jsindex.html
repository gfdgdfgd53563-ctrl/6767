<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Remote Desktop</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: Arial; }
        .container { display: flex; height: 100vh; }
        canvas { flex: 1; display: block; cursor: crosshair; }
        .sidebar { width: 200px; background: #111; padding: 15px; border-left: 1px solid #333; }
        .status { padding: 10px; background: #333; border-radius: 5px; margin-bottom: 15px; font-size: 12px; }
        .status.ok { color: #0f0; }
        .status.off { color: #f00; }
        button { width: 100%; padding: 8px; margin: 5px 0; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; }
        button:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="screen"></canvas>
        <div class="sidebar">
            <div class="status off" id="status">🔴 OFFLINE</div>
            <button onclick="click_mouse()">Click</button>
            <button onclick="send_key('Enter')">Enter</button>
            <button onclick="send_key('Delete')">Delete</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
